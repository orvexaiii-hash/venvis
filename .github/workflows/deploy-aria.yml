name: Deploy Aria

on:
  push:
    branches: [master]
    paths:
      - 'aria/**'
      - 'aria-web/**'

jobs:
  deploy-aria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy aria files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 31.97.21.155
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "aria/"
          target: "/etc/easypanel/projects/aria/aria/code/"

      - name: Build and deploy aria
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 31.97.21.155
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -e
            mkdir -p /etc/easypanel/projects/aria/aria/data

            # Copiar datos existentes (DB + sesión WA) al path del bind mount antes de migrar
            ARIA_CID=$(docker ps -q --filter label=com.docker.swarm.service.name=aria_aria 2>/dev/null | head -1)
            if [ -n "$ARIA_CID" ]; then
              docker cp "$ARIA_CID:/app/data/." /etc/easypanel/projects/aria/aria/data/ 2>/dev/null || true
              echo "✓ Datos copiados al bind mount"
            else
              echo "(sin contenedor aria corriendo, omitiendo copia)"
            fi

            cd /etc/easypanel/projects/aria/aria/code/aria
            docker build --no-cache -t easypanel/aria/aria:latest .

            # Migrar de volumen anónimo a bind mount (preserva env vars existentes del servicio)
            docker service update --mount-rm /app/data aria_aria 2>/dev/null || true
            docker service update --force \
              --image easypanel/aria/aria:latest \
              --mount-add type=bind,source=/etc/easypanel/projects/aria/aria/data,target=/app/data \
              aria_aria
            echo "✓ Aria deployed at $(date)"

  deploy-aria-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure aria-web directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 31.97.21.155
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: mkdir -p /etc/easypanel/projects/aria/aria-web/code/

      - name: Copy aria-web files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 31.97.21.155
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "aria-web/"
          target: "/etc/easypanel/projects/aria/aria-web/code/"

      - name: Build and deploy aria-web
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 31.97.21.155
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -e
            SECRET_FILE="/etc/easypanel/projects/aria/jwt-secret"
            [ -f "$SECRET_FILE" ] || openssl rand -hex 32 > "$SECRET_FILE"
            JWT_SECRET_VAL=$(cat "$SECRET_FILE")
            cd /etc/easypanel/projects/aria/aria-web/code/aria-web
            docker build --no-cache -t easypanel/aria/aria-web:latest .
            docker service rm aria_aria-web 2>/dev/null || true
            docker service create --name aria_aria-web \
                --mount type=bind,source=/etc/easypanel/projects/aria/aria/data,target=/app/data \
                --env DB_PATH=/app/data/aria.db \
                --env "JWT_SECRET=$JWT_SECRET_VAL" \
                --env NODE_ENV=production \
                -p 3002:3002 \
                easypanel/aria/aria-web:latest
            echo "✓ Aria Web deployed at $(date)"
